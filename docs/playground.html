<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 PyVibe Playground</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --pv-primary: #7C3AED;
            --pv-secondary: #06B6D4;
            --pv-bg: #1E1E2E;
            --pv-surface: #313244;
            --pv-text: #CDD6F4;
            --pv-green: #A6E3A1;
            --pv-red: #F38BA8;
            --pv-yellow: #F9E2AF;
            --pv-blue: #89B4FA;
            --pv-pink: #F5C2E7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--pv-bg); color: var(--pv-text); height: 100vh; display: flex; flex-direction: column; }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: var(--pv-surface);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .header h1 { font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
        .header h1 span { font-size: 1.5rem; }
        .header-actions { display: flex; gap: 12px; }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-run { background: var(--pv-primary); color: white; }
        .btn-run:hover { background: #6D28D9; }
        .btn-reset { background: var(--pv-surface); color: var(--pv-text); border: 1px solid rgba(255,255,255,0.2); }
        .btn-reset:hover { background: rgba(255,255,255,0.1); }
        .btn-copy { background: transparent; color: var(--pv-green); border: 1px solid var(--pv-green); }
        .btn-copy:hover { background: rgba(166,227,161,0.1); }

        /* Main layout */
        .main { display: flex; flex: 1; overflow: hidden; }

        /* Editor panel */
        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.1);
        }
        .panel-header {
            padding: 8px 16px;
            background: rgba(0,0,0,0.3);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--pv-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-header .dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot-red { background: #F38BA8; }
        .dot-yellow { background: #F9E2AF; }
        .dot-green { background: #A6E3A1; }

        textarea {
            flex: 1;
            background: var(--pv-bg);
            color: var(--pv-text);
            border: none;
            padding: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            resize: none;
            outline: none;
            tab-size: 4;
        }

        /* Preview panel */
        .preview-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }
        .preview-panel .panel-header { background: rgba(0,0,0,0.05); color: #6B7280; }

        .preview-frame {
            flex: 1;
            border: none;
            width: 100%;
            background: white;
        }

        /* Templates panel */
        .templates-bar {
            padding: 8px 16px;
            background: rgba(0,0,0,0.2);
            display: flex;
            gap: 8px;
            overflow-x: auto;
        }
        .template-chip {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            border: 1px solid rgba(255,255,255,0.15);
            background: transparent;
            color: var(--pv-text);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .template-chip:hover { background: var(--pv-primary); border-color: var(--pv-primary); color: white; }

        /* Status bar */
        .status-bar {
            padding: 4px 16px;
            background: var(--pv-primary);
            color: white;
            font-size: 0.7rem;
            display: flex;
            justify-content: space-between;
        }

        /* Syntax highlight helpers */
        .keyword { color: var(--pv-pink); }
        .string { color: var(--pv-green); }
        .comment { color: #6C7086; font-style: italic; }
        .function { color: var(--pv-blue); }
        .number { color: var(--pv-yellow); }

        @media (max-width: 768px) {
            .main { flex-direction: column; }
            .editor-panel, .preview-panel { flex: 1; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.1); }
        }
    </style>
</head>

        <h1><span>🐍</span> PyVibe Playground</h1>

        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        const status = document.getElementById('status');
        const timeEl = document.getElementById('time');

        let defaultCode = editor.value;

        function runCode() {
            const startTime = performance.now();
            status.textContent = '⏳ Generating HTML...';

            try {
                const code = editor.value;
                const html = generateHTML(code);

                // Write HTML to iframe
                const blob = new Blob([html], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                preview.src = url;

                const elapsed = (performance.now() - startTime).toFixed(0);
                status.textContent = '✅ Generated successfully';
                timeEl.textContent = `Done in ${elapsed}ms`;
            } catch (err) {
                status.textContent = `❌ Error: ${err.message}`;
                timeEl.textContent = 'Check your code';
            }
        }

        function generateHTML(code) {
            // Extract components from Python code
            let bodyContent = '';

            // Parse common patterns
            const parseComponent = (code) => {
                // Simple parser for PyVibe components
                let html = '';

                // Title patterns
                const titleMatch = code.match(/judul\(["'](.+?)["']/g);
                if (titleMatch) {
                    titleMatch.forEach(m => {
                        const text = m.match(/["'](.+?)["']/)[1];
                        html += `<h1 style="font-size:2.5rem;font-weight:700;margin:16px 0;text-align:center;">${text}</h1>`;
                    });
                }

                // Paragraph patterns
                const paraMatch = code.match(/paragraf\(["'](.+?)["']/g);
                if (paraMatch) {
                    paraMatch.forEach(m => {
                        const text = m.match(/["'](.+?)["']/)[1];
                        html += `<p style="font-size:1rem;color:#6B7280;margin:8px 0;text-align:center;">${text}</p>`;
                    });
                }

                // Button patterns
                const btnMatch = code.match(/tombol\(["'](.+?)["']/g);
                if (btnMatch) {
                    html += '<div style="display:flex;gap:12px;justify-content:center;margin:16px 0;flex-wrap:wrap;">';
                    btnMatch.forEach(m => {
                        const text = m.match(/["'](.+?)["']/)[1];
                        const isPrimary = m.includes('primary') || m.includes('purple');
                        html += `<button style="padding:10px 24px;border-radius:8px;font-weight:500;cursor:pointer;border:none;background:${isPrimary ? '#7C3AED' : '#F3F4F6'};color:${isPrimary ? 'white' : '#374151'};font-size:0.875rem;">${text}</button>`;
                    });
                    html += '</div>';
                }

                // Badge patterns
                const badgeMatch = code.match(/badge\(["'](.+?)["']/g);
                if (badgeMatch) {
                    html += '<div style="display:flex;gap:8px;margin:8px 0;justify-content:center;">';
                    badgeMatch.forEach(m => {
                        const text = m.match(/["'](.+?)["']/)[1];
                        html += `<span style="padding:4px 10px;border-radius:9999px;font-size:0.75rem;font-weight:600;background:#EDE9FE;color:#7C3AED;">${text}</span>`;
                    });
                    html += '</div>';
                }

                // Image patterns
                const imgMatch = code.match(/gambar\(["'](.+?)["']/g);
                if (imgMatch) {
                    imgMatch.forEach(m => {
                        const src = m.match(/["'](.+?)["']/)[1];
                        html += `<img src="${src}" style="width:100%;border-radius:8px;margin:16px 0;" />`;
                    });
                }

                return html;
            };

            bodyContent = parseComponent(code);

            // Build a styled preview page
            return `<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyVibe Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: #111827;
            background: white;
            padding: 40px 24px;
        }
        img { max-width: 100%; }
    </style>
</head>
<body>
    ${bodyContent || '<div style="text-align:center;padding:60px;color:#9CA3AF;"><h2>🐍 Klik ▶ Run untuk generate preview</h2><p style="margin-top:8px;">Tulis kode PyVibe di editor sebelah kiri</p></div>'}
</body>
</html>`;
        }

        function loadTemplate(name) {
            if (templates[name]) {
                editor.value = templates[name];
                runCode();
            }
        }

        function resetCode() {
            editor.value = defaultCode;
            runCode();
        }

        function copyCode() {
            navigator.clipboard.writeText(editor.value).then(() => {
                status.textContent = '📋 Code copied to clipboard!';
            });
        }

        // Tab support in editor
        editor.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
            }
            // Ctrl+Enter to run
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                runCode();
            }
        });

        // Auto-run on load
        runCode();
    </script>
</body>
</html>
