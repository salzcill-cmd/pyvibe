[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvibe-id"
version = "0.3.0"
description = "🐍 Build frontend websites in Python as easy as chatting"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "PyVibe Team", email = "hello@pyvibe.dev"},
]
keywords = ["python", "frontend", "web", "framework", "indonesia", "ui", "components", "charts", "forms", "seo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/salzcill-cmd/pyvibe"
Documentation = "https://github.com/salzcill-cmd/pyvibe/tree/main/docs"
Repository = "https://github.com/salzcill-cmd/pyvibe"
Issues = "https://github.com/salzcill-cmd/pyvibe/issues"

[project.scripts]
pyvibe = "pyvibe.cli.main:main"

[tool.setuptools.packages.find]
include = ["pyvibe*"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"
